name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: ["7.x", "8.x"]
    steps:
      - uses: actions/checkout@v4
      - name: Test the rules
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
        run: bazel test //... --test_output=errors
      - name: Test the example module
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
        working-directory: examples/site
        run: bazel test //... --test_output=errors
